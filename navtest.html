<!DOCTYPE html>
<html>
<head>
<style>
.wrap{position:relative;display:inline-block}
.drop{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.15);min-width:200px;padding:8px;z-index:9999}
.drop.show{display:block}
.drop a{display:block;padding:8px 12px;color:#333;text-decoration:none}
.drop a:hover{background:#eaf6fd}
button{padding:12px 16px;font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>
<nav style="background:#fff;border-bottom:2px solid #00A3E0;display:flex;align-items:center;padding:0 16px">
  <div class="wrap">
    <button onclick="tog(event,'d1')">By Category ▾</button>
    <div class="drop" id="d1">
      <a href="#">Singers</a>
      <a href="#">DJs</a>
      <a href="#">Dancers</a>
      <a href="#">Magicians</a>
    </div>
  </div>
  <div class="wrap">
    <button onclick="tog(event,'d2')">By Event ▾</button>
    <div class="drop" id="d2">
      <a href="#">Wedding</a>
      <a href="#">Corporate</a>
      <a href="#">Birthday</a>
    </div>
  </div>
  <div class="wrap">
    <button onclick="tog(event,'d3')">By Location ▾</button>
    <div class="drop" id="d3">
      <a href="#">Dubai</a>
      <a href="#">Abu Dhabi</a>
      <a href="#">Sharjah</a>
    </div>
  </div>
</nav>

<script>
function tog(e, id) {
  e.stopPropagation();
  var el = document.getElementById(id);
  var wasOpen = el.classList.contains('show');
  document.querySelectorAll('.drop').forEach(function(d){ d.classList.remove('show'); });
  if (!wasOpen) el.classList.add('show');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.drop').forEach(function(d){ d.classList.remove('show'); });
});
</script>
</body>
</html>
